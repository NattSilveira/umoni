name: Publicar Umoni no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/umoni
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
